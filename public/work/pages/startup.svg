idth="2"/><text x="270" y="1290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0f1220" text-anchor="middle" letter-spacing="0" opacity="1">Webhooks</text><rect x="620" y="1060" width="220" height="84" rx="16" fill="#3d5bff" stroke="#3d5bff" stroke-width="2"/><text x="730" y="1110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="0" opacity="1">Transform</text><rect x="1040" y="960" width="220" height="84" rx="16" fill="#f4f6ff" stroke="#cdd4ff" stroke-width="2"/><text x="1150" y="1010" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0f1220" text-anchor="middle" letter-spacing="0" opacity="1">Warehouse</text><rect x="1040" y="1160" width="220" height="84" rx="16" fill="#f4f6ff" stroke="#cdd4ff" stroke-width="2"/><text x="1150" y="1210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0f1220" text-anchor="middle" letter-spacing="0" opacity="1">Dashboard</text><path d="M380 922 C500 922 500 1102 620 1102 M380 1102 H620 M380 1282 C500 1282 500 1102 620 1102 M840 1102 C940 1102 940 1002 1040 1002 M840 1102 C940 1102 940 1202 1040 1202" stroke="#3d5bff" stroke-width="2.5" fill="none" stroke-dasharray="8 8"/><rect x="80" y="1580" width="620" height="560" rx="22" fill="#fff" stroke="#dde0ea" stroke-width="2"/><text x="120" y="1650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f1220" text-anchor="start" letter-spacing="0" opacity="1">Ask the docs</text><rect x="300" y="1690" width="360" height="64" rx="18" fill="#eef1ff" /><text x="320" y="1730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f1220" text-anchor="start" letter-spacing="0" opacity="1">How do I retry a failed sync?</text><rect x="120" y="1780" width="460" height="1